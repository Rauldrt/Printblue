<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrintLabel Pro - Generador e Impresor de Etiquetas</title>
    
    <!-- Metadatos PWA -->
    <meta name="description" content="Generador y gestor de etiquetas de código de barras y QR para impresoras térmicas y Bluetooth con integración a Google Drive.">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PrintLabel Pro">
    
    <!-- Enlaces Manifiesto e Iconos -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="alternate icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col text-slate-800 antialiased select-none sm:select-auto">

    <!-- Header Principal -->
    <include src="src/components/Header.html" />

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 no-print">
        
        <!-- Pestañas de Navegación M3 (Segmented Capsule Bar) Sticky -->
        <include src="src/components/StickyNav.html" />

        <!-- Barra de Sugerencias de Etiquetas Recientes Fuera del Card -->
        <include src="src/components/RecentSuggestionsBar.html" />

        <!-- SECCIÓN 1: ETIQUETA ÚNICA (Diseñador M3) -->
        <div id="tab-single" class="tab-content grid grid-cols-1 lg:grid-cols-12 gap-8 pb-24 lg:pb-0">
            <include src="src/components/SingleLabelForm.html" />
            <include src="src/components/LabelPreview.html" />
        </div>

        <!-- SECCIÓN 2: IMPRESIÓN POR LOTE -->
        <include src="src/components/BatchTab.html" />

        <!-- SECCIÓN 3: DISEÑADOR PERSONALIZADO & LOGO -->
        <include src="src/components/DesignerTab.html" />
    </main>

    <!-- Modales de Integración y Catálogo M3 -->
    <include src="src/components/modals/PreviewModal.html" />
    <include src="src/components/modals/DriveModal.html" />
    <include src="src/components/modals/MappingModal.html" />
    <include src="src/components/modals/SavedLabelsModal.html" />
    <include src="src/components/modals/AiScanModal.html" />
    <include src="src/components/modals/HelpModal.html" />

    <!-- Área de Impresión del Sistema (Windows / Mac) -->
    <div id="print-area"></div>

    <!-- MATERIAL DESIGN 3 - FLOATING ACTION BUTTON & SETTINGS CARD -->
    <include src="src/components/modals/SettingsFabModal.html" />

    <!-- Dock Dinámico Flotante en el Pie de la App (Móviles) -->
    <include src="src/components/MobileBottomDock.html" />

    <!-- Contenedor de Alertas Toast -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <!-- Script Principal de la Aplicación -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
