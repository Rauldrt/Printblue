<!-- Modal Vista Previa Real e Impresión para Pantallas Pequeñas M3 -->
<div id="preview-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 hidden items-center justify-center p-3 sm:p-4">
    <div class="m3-dialog-content bg-white rounded-[28px] max-w-lg w-full p-4 sm:p-6 space-y-4 shadow-2xl flex flex-col max-h-[94vh] overflow-hidden border border-slate-200/80">
        
        <!-- Header del Modal -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white flex items-center justify-center text-sm shadow-xs">
                    <i class="fa-solid fa-eye"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h3 class="font-bold text-slate-900 text-sm sm:text-base leading-tight">Vista Previa e Impresión</h3>
                        <span id="modal-preview-dim-badge" class="bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded-full text-[10px] border border-indigo-200">55x44 mm</span>
                    </div>
                    <p class="text-[11px] text-slate-400">Verifica la etiqueta antes de imprimir</p>
                </div>
            </div>
            <button type="button" onclick="closePreviewModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition active:scale-95" title="Cerrar vista previa">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- Contenido con Scroll: Visualizador Térmico y Opciones -->
        <div class="flex-1 overflow-y-auto space-y-4 pr-1">
            
            <!-- Contenedor de la Etiqueta Térmica -->
            <div class="w-full bg-slate-100/80 p-4 sm:p-6 rounded-2xl flex flex-col items-center justify-center min-h-[220px] relative border border-slate-200/90 shadow-inner">
                <div id="modal-label-container" class="thermal-paper label-preview-shadow rounded-sm p-2 flex flex-col items-center justify-between text-center transition-all duration-200 overflow-hidden box-border"></div>
                <p class="mt-3 text-[11px] text-slate-500 text-center">
                    Proporción exacta configurada para tu rollo térmico.
                </p>
            </div>

            <!-- Cantidad de Copias -->
            <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200 flex items-center justify-between">
                <div>
                    <label class="text-xs font-bold text-slate-800 block">Copias a imprimir:</label>
                    <span class="text-[10px] text-slate-500">Cantidad para esta orden</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button type="button" onclick="adjustQty(-1)" class="w-8 h-8 rounded-full bg-white hover:bg-slate-100 border border-slate-200 font-bold text-slate-700 text-sm active:scale-90 flex items-center justify-center transition shadow-2xs">-</button>
                    <input type="number" id="modal-inp-quantity" value="1" min="1" max="100" class="w-14 text-center text-xs m3-input p-1.5 font-bold bg-white" onchange="document.getElementById('inp-quantity').value=this.value" oninput="document.getElementById('inp-quantity').value=this.value">
                    <button type="button" onclick="adjustQty(1)" class="w-8 h-8 rounded-full bg-white hover:bg-slate-100 border border-slate-200 font-bold text-slate-700 text-sm active:scale-90 flex items-center justify-center transition shadow-2xs">+</button>
                </div>
            </div>

            <!-- Botones de Impresión en el Modal -->
            <div class="space-y-2.5">
                <!-- Botón Principal: Bluetooth Directo -->
                <button type="button" id="modal-btn-print-direct-bt" onclick="printSingleDirectBT()" class="flex w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition items-center justify-center space-x-2 text-sm border border-emerald-500/80 active:scale-[0.98]">
                    <i class="fa-brands fa-bluetooth-b text-base"></i>
                    <span>Imprimir Directo por Bluetooth</span>
                </button>

                <!-- Botones Secundarios: Sistema y PNG -->
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="triggerPrintSystem()" class="m3-btn-filled py-2.5 px-3 rounded-xl shadow-2xs flex items-center justify-center space-x-1.5 text-xs active:scale-[0.98]">
                        <i class="fa-solid fa-print"></i>
                        <span>Impresión Sistema</span>
                    </button>
                    <button type="button" onclick="downloadLabelImage()" class="m3-btn-outlined py-2.5 px-3 rounded-xl shadow-2xs flex items-center justify-center space-x-1.5 text-xs active:scale-[0.98]">
                        <i class="fa-solid fa-download text-slate-500"></i>
                        <span>Guardar PNG</span>
                    </button>
                </div>

                <!-- Test de Paso de Papel -->
                <div class="pt-1 flex items-center justify-between text-[11px] text-slate-500 px-1">
                    <span class="text-slate-400">¿Ranura desalineada?</span>
                    <button type="button" onclick="feedOneLabelBluetooth()" class="inline-flex items-center space-x-1 text-indigo-600 hover:text-indigo-700 font-semibold text-xs py-1 px-2 rounded-lg hover:bg-indigo-50 transition active:scale-95">
                        <i class="fa-solid fa-forward-step text-[10px]"></i>
                        <span>Avanzar 1 Etiqueta</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer del Modal -->
        <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between">
            <button type="button" onclick="closePreviewModal(); openSettingsFAB();" class="text-[11px] text-indigo-600 hover:underline font-semibold flex items-center space-x-1.5 active:scale-95">
                <i class="fa-solid fa-sliders text-indigo-500"></i>
                <span>Ajustes & Calibración (FAB)</span>
            </button>
            <button type="button" onclick="closePreviewModal()" class="m3-btn-outlined text-xs font-semibold px-4 py-2 rounded-full active:scale-95">
                Volver al Editor
            </button>
        </div>
    </div>
</div>
