<!-- Modal Mapeo Avanzado de Columnas de Google Sheets M3 -->
<div id="mapping-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-4">
    <div class="m3-dialog-content bg-white rounded-[28px] max-w-2xl w-full p-5 sm:p-6 space-y-4 shadow-2xl max-h-[92vh] flex flex-col">
        <div class="flex justify-between items-start border-b border-slate-100 pb-3">
            <div class="space-y-0.5">
                <h3 class="font-bold text-slate-900 text-base flex items-center space-x-2">
                    <i class="fa-solid fa-table-columns text-indigo-600"></i>
                    <span>Mapeo de Columnas de Google Sheets</span>
                </h3>
                <p id="map-sheet-name" class="text-xs text-indigo-600 font-semibold truncate max-w-sm sm:max-w-md"></p>
            </div>
            <button onclick="closeMappingModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition active:scale-95">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto space-y-4 pr-1">
            <!-- Selector de Pestaña / Hoja de cálculo -->
            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div class="text-xs font-semibold text-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-layer-group text-slate-500"></i>
                    <span>Pestaña seleccionada:</span>
                </div>
                <select id="map-tab-select" onchange="switchSpreadsheetTab(this.value)" class="m3-input text-xs p-2 bg-white font-medium">
                </select>
            </div>

            <!-- Grid de Mapeo de Campos -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <!-- Nombre / Título -->
                <div class="p-3 bg-white border border-slate-200 rounded-2xl space-y-1 shadow-2xs">
                    <label class="font-bold text-slate-800 flex items-center justify-between">
                        <span><i class="fa-solid fa-tag text-indigo-500 mr-1.5"></i>Título / Producto</span>
                        <span class="text-[10px] text-rose-500 font-bold">* Obligatorio</span>
                    </label>
                    <select id="map-col-title" onchange="updateMappingPreview()" class="m3-input w-full text-xs p-2 bg-slate-50 font-medium">
                    </select>
                </div>

                <!-- Código de Barras / SKU -->
                <div class="p-3 bg-white border border-slate-200 rounded-2xl space-y-1 shadow-2xs">
                    <label class="font-bold text-slate-800 flex items-center justify-between">
                        <span><i class="fa-solid fa-barcode text-indigo-500 mr-1.5"></i>Código / SKU / EAN</span>
                        <span class="text-[10px] text-rose-500 font-bold">* Obligatorio</span>
                    </label>
                    <select id="map-col-code" onchange="updateMappingPreview()" class="m3-input w-full text-xs p-2 bg-slate-50 font-medium">
                    </select>
                </div>

                <!-- Precio -->
                <div class="p-3 bg-white border border-slate-200 rounded-2xl space-y-1 shadow-2xs">
                    <label class="font-bold text-slate-800 flex items-center justify-between">
                        <span><i class="fa-solid fa-dollar-sign text-emerald-500 mr-1.5"></i>Precio</span>
                        <span class="text-[10px] text-slate-400 font-normal">Opcional</span>
                    </label>
                    <select id="map-col-price" onchange="updateMappingPreview()" class="m3-input w-full text-xs p-2 bg-slate-50 font-medium">
                    </select>
                </div>

                <!-- Texto Extra / Lote -->
                <div class="p-3 bg-white border border-slate-200 rounded-2xl space-y-1 shadow-2xs">
                    <label class="font-bold text-slate-800 flex items-center justify-between">
                        <span><i class="fa-solid fa-circle-info text-amber-500 mr-1.5"></i>Extra / Lote / Detalle</span>
                        <span class="text-[10px] text-slate-400 font-normal">Opcional</span>
                    </label>
                    <select id="map-col-extra" onchange="updateMappingPreview()" class="m3-input w-full text-xs p-2 bg-slate-50 font-medium">
                    </select>
                </div>

                <!-- Cantidad a Imprimir -->
                <div class="sm:col-span-2 p-3 bg-white border border-slate-200 rounded-2xl space-y-1 shadow-2xs">
                    <label class="font-bold text-slate-800 flex items-center justify-between">
                        <span><i class="fa-solid fa-copy text-indigo-500 mr-1.5"></i>Cantidad de Copias a Imprimir</span>
                        <span class="text-[10px] text-slate-500 font-normal">Fija o por columna de Stock</span>
                    </label>
                    <select id="map-col-qty" onchange="updateMappingPreview()" class="m3-input w-full text-xs p-2 bg-slate-50 font-medium">
                    </select>
                </div>
            </div>

            <!-- Previsualización en vivo -->
            <div class="space-y-1.5 pt-1">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-700">
                    <span>Vista previa de datos mapeados (primeras filas):</span>
                    <span id="mapping-total-count" class="bg-indigo-50 text-indigo-700 font-bold px-2.5 py-0.5 rounded-full text-[10px] border border-indigo-200"></span>
                </div>
                <div id="mapping-preview-table" class="rounded-xl overflow-hidden border border-slate-200"></div>
            </div>
        </div>

        <!-- Botones de Acción M3 -->
        <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2">
            <button onclick="closeMappingModal()" class="m3-btn-outlined text-xs font-semibold px-4 py-2.5 rounded-full active:scale-95">
                Cancelar
            </button>
            <button onclick="applyMappingAndImport()" class="m3-btn-filled text-xs font-bold px-5 py-2.5 rounded-full shadow-sm flex items-center space-x-1.5 active:scale-95">
                <i class="fa-solid fa-cloud-arrow-down"></i>
                <span>Confirmar e Importar</span>
            </button>
        </div>
    </div>
</div>
