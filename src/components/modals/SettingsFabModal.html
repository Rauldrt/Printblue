<!-- ========================================================
     MATERIAL DESIGN 3 - FLOATING ACTION BUTTON & SETTINGS CARD
     ======================================================== -->

<!-- Backdrop oscuro para cerrar al hacer clic afuera -->
<div id="m3-fab-backdrop" class="m3-fab-backdrop" onclick="closeSettingsFAB()"></div>

<!-- Contenedor Transformable (FAB -> Card con animación de estiramiento M3) -->
<div id="m3-settings-fab" class="m3-fab-morph-container is-collapsed">
    
    <!-- Estado Colapsado: Botón FAB Flotante M3 -->
    <button type="button" onclick="openSettingsFAB()" class="m3-fab-trigger-btn group" title="Configuraciones y Ajustes">
        <i class="fa-solid fa-sliders text-2xl text-white group-hover:scale-110 transition-transform duration-300"></i>
    </button>

    <!-- Estado Expandido: Card de Configuración M3 con Acordeón -->
    <div class="m3-fab-card-content">
        
        <!-- Cabecera de la Card M3 -->
        <div class="flex items-center justify-between px-4 sm:px-5 py-3 sm:py-4 border-b border-slate-200/80 bg-white select-none shrink-0">
            <div class="flex items-center space-x-2.5 sm:space-x-3">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-base sm:text-lg border border-indigo-100 shadow-2xs shrink-0">
                    <i class="fa-solid fa-sliders"></i>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center space-x-2">
                        <h3 class="font-bold text-slate-900 text-xs sm:text-base leading-tight truncate">Configuración y Ajustes</h3>
                        <span id="fab-header-badge" class="bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded-full text-[10px] border border-indigo-200 shrink-0">55x44 mm</span>
                    </div>
                    <p class="text-[10px] sm:text-[11px] text-slate-500 truncate">Parámetros del rollo, anti-drift, código y Bluetooth</p>
                </div>
            </div>
            <button type="button" onclick="closeSettingsFAB()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition shrink-0 ml-1" title="Cerrar ajustes">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- Contenedor con Scroll de las 5 Secciones Acordeón -->
        <div class="flex-1 overflow-y-auto p-3 sm:p-5 space-y-3 bg-slate-50/70">
            
            <!-- SECCIÓN 1: Configuración del Rollo de Etiquetas -->
            <div class="m3-accordion-item is-open" id="accordion-item-0">
                <button type="button" onclick="toggleAccordion(0)" class="m3-accordion-header">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-ruler-combined"></i>
                        </div>
                        <span class="text-xs font-bold text-slate-800">Configuración del Rollo de Etiquetas</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span id="accordion-summary-roll" class="text-[10px] font-bold text-indigo-700 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">55x44 mm</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 text-xs m3-accordion-chevron"></i>
                    </div>
                </button>
                <div class="m3-accordion-body">
                    <div class="p-3.5 pt-1 space-y-3 border-t border-slate-100">
                        <!-- Presets Rápidos -->
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-600 mb-1.5">Tamaños Estándar Frecuentes</label>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                                <button type="button" onclick="applyPreset(55, 44)" class="preset-btn p-2 border rounded-xl text-center hover:border-indigo-500 hover:bg-indigo-50 text-xs font-medium border-indigo-200 bg-indigo-50/50 transition">
                                    <span class="block font-bold text-indigo-700">55 x 44 mm</span>
                                    <span class="text-[9px] text-indigo-500">Go Link GL033</span>
                                </button>
                                <button type="button" onclick="applyPreset(50, 30)" class="preset-btn p-2 border rounded-xl text-center hover:border-indigo-500 hover:bg-indigo-50 text-xs font-medium bg-white border-slate-200 transition">
                                    <span class="block font-bold text-slate-800">50 x 30 mm</span>
                                    <span class="text-[9px] text-slate-500">Estándar</span>
                                </button>
                                <button type="button" onclick="applyPreset(40, 25)" class="preset-btn p-2 border rounded-xl text-center hover:border-indigo-500 hover:bg-indigo-50 text-xs font-medium bg-white border-slate-200 transition">
                                    <span class="block font-bold text-slate-800">40 x 25 mm</span>
                                    <span class="text-[9px] text-slate-500">Pequeña</span>
                                </button>
                                <button type="button" onclick="applyPreset(58, 40)" class="preset-btn p-2 border rounded-xl text-center hover:border-indigo-500 hover:bg-indigo-50 text-xs font-medium bg-white border-slate-200 transition">
                                    <span class="block font-bold text-slate-800">58 x 40 mm</span>
                                    <span class="text-[9px] text-slate-500">Mediana</span>
                                </button>
                                <button type="button" onclick="applyPreset(57, 100)" class="preset-btn p-2 border rounded-xl text-center hover:border-indigo-500 hover:bg-indigo-50 text-xs font-medium bg-white border-slate-200 transition">
                                    <span class="block font-bold text-slate-800">58 mm</span>
                                    <span class="text-[9px] text-slate-500">Continuo</span>
                                </button>
                            </div>
                        </div>

                        <!-- Dimensiones Personalizadas -->
                        <div class="grid grid-cols-2 gap-2.5">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-700 mb-1">Ancho (mm)</label>
                                <input type="number" id="setting-width" value="55" class="w-full text-xs border-slate-300 rounded-lg p-2 border bg-white focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-700 mb-1">Alto (mm)</label>
                                <input type="number" id="setting-height" value="44" class="w-full text-xs border-slate-300 rounded-lg p-2 border bg-white focus:ring-indigo-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2.5">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-700 mb-1">Margen Interno (mm)</label>
                                <input type="number" id="setting-padding" value="2" class="w-full text-xs border-slate-300 rounded-lg p-2 border bg-white focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-700 mb-1">Fuente Texto (pt)</label>
                                <input type="number" id="setting-fontsize" value="10" class="w-full text-xs border-slate-300 rounded-lg p-2 border bg-white focus:ring-indigo-500">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: Calibración de Paso y Anti-Desplazamiento -->
            <div class="m3-accordion-item" id="accordion-item-1">
                <button type="button" onclick="toggleAccordion(1)" class="m3-accordion-header">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-arrows-split-up-and-left"></i>
                        </div>
                        <span class="text-xs font-bold text-slate-800">Calibración de Paso y Anti-Desplazamiento</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded">Exacto</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 text-xs m3-accordion-chevron"></i>
                    </div>
                </button>
                <div class="m3-accordion-body">
                    <div class="p-3.5 pt-1 space-y-3 border-t border-slate-100">
                        <!-- Modo de Avance de Papel -->
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-700 mb-1">Modo de Avance de Papel:</label>
                            <select id="setting-feed-mode" onchange="setFeedMode(this.value)" class="w-full text-xs border-slate-300 rounded-lg p-2 border bg-white font-medium focus:ring-1 focus:ring-indigo-500">
                                <option value="exact">Paso Milimétrico Exacto (Recomendado para Go Link GL033 / 58mm)</option>
                                <option value="sensor">Sensor Óptico de Ranura / Gap (Form Feed)</option>
                                <option value="receipt">Ticket Continuo (Expulsión tradicional)</option>
                            </select>
                        </div>

                        <!-- Sliders de Gap y Offset -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 p-2.5 bg-slate-100/70 rounded-xl border border-slate-200/80">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-[11px] font-semibold text-slate-700">Separación (Gap)</label>
                                    <span id="gap-val" class="text-xs font-bold text-indigo-600 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">2.0 mm</span>
                                </div>
                                <input type="range" id="setting-gap" min="0" max="10" step="0.5" value="2" 
                                    oninput="syncGapInput(this.value)" class="w-full accent-indigo-600 cursor-pointer">
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-[11px] font-semibold text-slate-700">Micro-Ajuste (Offset)</label>
                                    <span id="feed-offset-val" class="text-xs font-bold text-indigo-600 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">+0.0 mm</span>
                                </div>
                                <input type="range" id="setting-feed-offset" min="-4.0" max="4.0" step="0.2" value="0" 
                                    oninput="syncFeedOffsetInput(this.value)" class="w-full accent-indigo-600 cursor-pointer">
                            </div>
                        </div>

                        <!-- Botón de Test de Paso -->
                        <div class="flex items-center justify-between pt-1">
                            <button type="button" onclick="feedOneLabelBluetooth()" class="inline-flex items-center space-x-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-2xs">
                                <i class="fa-solid fa-forward-step"></i>
                                <span>Avanzar 1 Etiqueta (Test de Paso)</span>
                            </button>
                            <span class="text-[10px] text-slate-400">Verifica que frene en la ranura</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 3: Ajuste de Dimensiones del Código -->
            <div class="m3-accordion-item" id="accordion-item-2">
                <button type="button" onclick="toggleAccordion(2)" class="m3-accordion-header">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-barcode"></i>
                        </div>
                        <span class="text-xs font-bold text-slate-800">Ajuste de Dimensiones del Código</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span id="accordion-summary-code" class="text-[10px] font-bold text-indigo-700 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">55% | 2.0x</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 text-xs m3-accordion-chevron"></i>
                    </div>
                </button>
                <div class="m3-accordion-body">
                    <div class="p-3.5 pt-1 space-y-3 border-t border-slate-100">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-[11px] font-semibold text-slate-700">Altura del Código / QR</label>
                                <span id="barcode-height-val" class="text-xs font-bold text-indigo-600 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">55%</span>
                            </div>
                            <input type="range" id="setting-barcode-height" min="25" max="80" step="5" value="55" class="w-full accent-indigo-600 cursor-pointer">
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-[11px] font-semibold text-slate-700">Grosor de Barras (Escala Horizontal)</label>
                                <span id="barcode-width-val" class="text-xs font-bold text-indigo-600 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">2.0x</span>
                            </div>
                            <input type="range" id="setting-barcode-width" min="1.0" max="3.0" step="0.1" value="2.0" class="w-full accent-indigo-600 cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 4: Márgenes y Separaciones Manuales -->
            <div class="m3-accordion-item" id="accordion-item-3">
                <button type="button" onclick="toggleAccordion(3)" class="m3-accordion-header">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-arrows-up-down"></i>
                        </div>
                        <span class="text-xs font-bold text-slate-800">Márgenes y Separaciones Manuales</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span id="accordion-summary-margins" class="text-[10px] font-bold text-indigo-700 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">Sup: 2.0 | Inf: 2.0</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 text-xs m3-accordion-chevron"></i>
                    </div>
                </button>
                <div class="m3-accordion-body">
                    <div class="p-3.5 pt-1 space-y-3 border-t border-slate-100">
                        <!-- Márgenes Superior e Inferior -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 p-2.5 bg-slate-100/70 rounded-xl border border-slate-200/80">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-[11px] font-semibold text-slate-700">Margen Superior</label>
                                    <span id="margin-top-val" class="text-xs font-bold text-indigo-600 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">2.0 mm</span>
                                </div>
                                <input type="range" id="setting-margin-top" min="0" max="15" step="0.5" value="2" 
                                    oninput="syncMarginInputs('top', this.value)" class="w-full accent-indigo-600 cursor-pointer">
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-[11px] font-semibold text-slate-700">Margen Inferior</label>
                                    <span id="margin-bottom-val" class="text-xs font-bold text-indigo-600 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">2.0 mm</span>
                                </div>
                                <input type="range" id="setting-margin-bottom" min="0" max="15" step="0.5" value="2" 
                                    oninput="syncMarginInputs('bottom', this.value)" class="w-full accent-indigo-600 cursor-pointer">
                            </div>
                        </div>

                        <!-- Separaciones Título y Pie -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-[11px] font-medium text-slate-700">Título ↔ Código</label>
                                    <span id="spacing-title-val" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">2.0 mm</span>
                                </div>
                                <input type="range" id="setting-spacing-title" min="0" max="15" step="0.5" value="2" 
                                    oninput="syncSpacingInputs('title', this.value)" class="w-full accent-indigo-600 cursor-pointer">
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-[11px] font-medium text-slate-700">Código ↔ Pie</label>
                                    <span id="spacing-footer-val" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">2.0 mm</span>
                                </div>
                                <input type="range" id="setting-spacing-footer" min="0" max="15" step="0.5" value="2" 
                                    oninput="syncSpacingInputs('footer', this.value)" class="w-full accent-indigo-600 cursor-pointer">
                            </div>
                        </div>

                        <!-- Distribución Vertical -->
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-700 mb-1.5">Alineación / Distribución:</label>
                            <div class="grid grid-cols-3 gap-1.5">
                                <button type="button" onclick="setVerticalAlign('center')" id="valign-center-btn" class="valign-btn py-1.5 px-2 rounded-lg border text-xs font-bold bg-indigo-600 text-white border-indigo-600 shadow-sm transition">Centrado</button>
                                <button type="button" onclick="setVerticalAlign('space-between')" id="valign-space-between-btn" class="valign-btn py-1.5 px-2 rounded-lg border text-xs font-medium bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 transition">Bordes</button>
                                <button type="button" onclick="setVerticalAlign('flex-start')" id="valign-flex-start-btn" class="valign-btn py-1.5 px-2 rounded-lg border text-xs font-medium bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 transition">Arriba</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 5: Protocolo Bluetooth Directo -->
            <div class="m3-accordion-item" id="accordion-item-4">
                <button type="button" onclick="toggleAccordion(4)" class="m3-accordion-header">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs">
                            <i class="fa-brands fa-bluetooth-b"></i>
                        </div>
                        <span class="text-xs font-bold text-slate-800">Protocolo Bluetooth Directo</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span id="accordion-summary-bt" class="text-[10px] font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded">ESC/POS</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 text-xs m3-accordion-chevron"></i>
                    </div>
                </button>
                <div class="m3-accordion-body">
                    <div class="p-3.5 pt-1 space-y-3 border-t border-slate-100">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-700 mb-1">Protocolo de Envío:</label>
                            <select id="setting-bt-protocol" onchange="localStorage.setItem('bt_protocol', this.value); window.showToast('Protocolo actualizado: ' + (this.value === 'tspl' ? 'TSPL Nativo' : 'ESC/POS Gráfico'), 'info'); updateSettingsSummaries();" class="w-full text-xs border-slate-300 rounded-lg p-2 border bg-white font-medium focus:ring-1 focus:ring-indigo-500">
                                <option value="escpos">ESC/POS Gráfico Raster (Recomendado para Go Link GL033, POS-58, MPT-II)</option>
                                <option value="tspl">TSPL Nativo (TSC, Xprinter, Zebra)</option>
                            </select>
                            <p class="text-[10px] text-slate-400 mt-1">ESC/POS Gráfico envía la etiqueta píxel a píxel directamente por Bluetooth.</p>
                        </div>

                        <div class="pt-1">
                            <label class="block text-[11px] font-semibold text-slate-700 mb-1.5">Conectar en PC:</label>
                            <div class="flex flex-wrap gap-2">
                                <button type="button" onclick="connectBluetoothPrinter()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5 shadow-2xs">
                                    <i class="fa-brands fa-bluetooth-b text-indigo-600"></i>
                                    <span>Bluetooth BLE</span>
                                </button>
                                <button type="button" onclick="connectSerialPrinter()" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5 shadow-2xs">
                                    <i class="fa-solid fa-plug text-amber-600"></i>
                                    <span>USB / Bluetooth COM</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer de la Card M3 -->
        <div class="px-4 sm:px-5 py-3 sm:py-3.5 border-t border-slate-200/80 bg-white flex items-center justify-between shrink-0">
            <span class="text-[11px] text-slate-500 flex items-center space-x-1.5">
                <i class="fa-solid fa-circle-check text-emerald-500 text-xs"></i>
                <span>Ajustes reactivos en vivo</span>
            </span>
            <button type="button" onclick="closeSettingsFAB()" class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-xs px-5 py-2 rounded-xl shadow-sm transition">
                Listo
            </button>
        </div>
    </div>
</div>
