<div class="lg:col-span-5 m3-card p-6 space-y-5 rounded-3xl">
    <div class="border-b border-slate-100 pb-3">
        <h2 class="text-base font-bold text-slate-900">Datos del Producto</h2>
    </div>

    <div class="space-y-4">
        <!-- Nombre del Producto -->
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre / Título del Producto</label>
            <input type="text" id="inp-title" value="Remera Algodón Talle M" enterkeyhint="next" class="m3-input w-full text-sm p-2.5 font-medium" placeholder="Ej: Café Orgánico 500g">
        </div>

        <!-- Código de Barras / SKU -->
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Código / SKU / EAN</label>
            <input type="text" id="inp-code" value="779123456789" enterkeyhint="next" class="m3-input w-full text-sm p-2.5 font-mono" placeholder="12345678">
        </div>

        <!-- Botón Desplegable y Subcard: Extras -->
        <div class="pt-1">
            <button type="button" onclick="toggleExtrasSubcard()" id="btn-toggle-extras" class="w-full flex items-center justify-between p-3 rounded-2xl bg-slate-50/90 hover:bg-indigo-50/70 border border-slate-200/90 hover:border-indigo-300 transition-all duration-200 shadow-2xs group active:scale-[0.99]">
                <div class="flex items-center space-x-2.5">
                    <div class="w-7 h-7 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs group-hover:bg-indigo-600 group-hover:text-white transition-colors shadow-2xs">
                        <i class="fa-solid fa-sliders"></i>
                    </div>
                    <div class="text-left">
                        <span class="block text-xs font-bold text-slate-800">Extras</span>
                        <span class="block text-[10px] text-slate-500 font-medium">Tipo de código, precio, moneda, texto extra y apariencia</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="extras-active-pill" class="hidden text-[10px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded-full shadow-2xs">Activo</span>
                    <i id="extras-chevron" class="fa-solid fa-chevron-down text-slate-400 group-hover:text-indigo-600 transition-transform duration-300 text-xs"></i>
                </div>
            </button>

            <!-- Subcard Contenedor Oculto -->
            <div id="extras-subcard" class="hidden mt-2 p-3.5 sm:p-4 rounded-2xl bg-gradient-to-b from-slate-50/95 to-indigo-50/40 border border-indigo-100/90 space-y-3.5 shadow-2xs transition-all duration-300">
                <!-- Tipo de Código -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Tipo de Código</label>
                    <select id="inp-symbology" class="m3-input w-full text-sm p-2.5 bg-white font-medium">
                        <option value="CODE128">Code 128 (Uso Interno/SKU)</option>
                        <option value="EAN13">EAN-13 (Comercial 13 dígitos)</option>
                        <option value="EAN8">EAN-8 (8 dígitos)</option>
                        <option value="UPC">UPC-A (EE.UU.)</option>
                        <option value="CODE39">Code 39</option>
                        <option value="QR">Código QR</option>
                    </select>
                </div>

                <!-- Precio y Moneda -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Precio</label>
                        <input type="text" id="inp-price" value="4500" enterkeyhint="next" class="m3-input w-full text-sm p-2.5 font-medium" placeholder="Ej: 1500.00">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Símbolo / Moneda</label>
                        <input type="text" id="inp-currency" value="$" enterkeyhint="next" class="m3-input w-full text-sm p-2.5 font-medium" placeholder="Ej: $ o U$S">
                    </div>
                </div>

                <!-- Texto Secundario u Adicional -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Texto Adicional (Opcional)</label>
                    <input type="text" id="inp-extra" value="Mi Tienda - Hecho en Argentina" enterkeyhint="next" class="m3-input w-full text-sm p-2.5 font-medium" placeholder="Ej: Lote 104 - Venc: 12/26">
                </div>

                <!-- Opciones Visuales de Apariencia -->
                <div class="pt-3 border-t border-indigo-100/90 space-y-2.5">
                    <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Opciones de Apariencia</h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center space-x-2 cursor-pointer p-1 rounded-lg hover:bg-white/80 transition">
                            <input type="checkbox" id="chk-show-title" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span class="font-medium text-slate-700">Mostrar Título</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer p-1 rounded-lg hover:bg-white/80 transition">
                            <input type="checkbox" id="chk-show-price" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span class="font-medium text-slate-700">Mostrar Precio</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer p-1 rounded-lg hover:bg-white/80 transition">
                            <input type="checkbox" id="chk-show-extra" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span class="font-medium text-slate-700">Mostrar Texto Extra</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer p-1 rounded-lg hover:bg-white/80 transition">
                            <input type="checkbox" id="chk-bold-price" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span class="font-medium text-slate-700">Precio Destacado</span>
                        </label>
                    </div>
                </div>

                <!-- Enlace rápido a Ajustes FAB dentro de Extras -->
                <div class="pt-2 border-t border-indigo-100/70 flex items-center justify-between text-[11px] text-slate-500">
                    <span class="text-slate-400">¿Márgenes o formato de rollo?</span>
                    <button type="button" onclick="openSettingsFAB()" class="text-indigo-600 hover:text-indigo-700 font-semibold flex items-center space-x-1.5 hover:underline active:scale-95">
                        <i class="fa-solid fa-sliders text-indigo-500"></i>
                        <span>Ajustes FAB</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Cantidad a Imprimir -->
        <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between">
            <label class="text-xs font-semibold text-slate-700">Copias a imprimir:</label>
            <div class="flex items-center space-x-2">
                <button onclick="adjustQty(-1)" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 text-sm active:scale-90 flex items-center justify-center transition">-</button>
                <input type="number" id="inp-quantity" value="1" min="1" max="100" enterkeyhint="done" class="w-16 text-center text-sm m3-input p-1.5 font-bold">
                <button onclick="adjustQty(1)" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 text-sm active:scale-90 flex items-center justify-center transition">+</button>
            </div>
        </div>

        <!-- Fila de Acciones Dinámicas M3 -->
        <div class="pt-3 border-t border-slate-100 space-y-2">
            <!-- Botón Dinámico para Móviles / Pantallas Pequeñas: Abre el Modal de Vista Previa e Impresión -->
            <button type="button" id="btn-open-preview-modal" onclick="openPreviewModal()" class="hidden lg:hidden w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md text-xs items-center justify-center space-x-2 transition active:scale-[0.98]">
                <i class="fa-solid fa-eye text-sm"></i>
                <span>Ver Vista Previa e Imprimir</span>
            </button>

            <div class="flex items-center gap-2">
                <!-- Botón Dinámico: Guardar Etiqueta (solo cuando Nombre y Código tienen contenido) -->
                <button type="button" id="btn-save-label" onclick="saveCurrentSingleLabel()" class="hidden flex-1 m3-btn-filled py-3 px-4 rounded-2xl shadow-sm text-xs items-center justify-center space-x-2 transition active:scale-[0.98]">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span id="btn-save-label-text">Guardar Etiqueta</span>
                </button>

                <!-- Botón Biblioteca (siempre accesible) -->
                <button type="button" onclick="openSavedLabelsModal()" class="flex-1 m3-btn-tonal py-3 px-4 rounded-2xl text-xs flex items-center justify-center space-x-1.5 transition active:scale-[0.98]" title="Ver catálogo de etiquetas guardadas">
                    <i class="fa-solid fa-folder-open text-indigo-600"></i>
                    <span>Biblioteca</span>
                </button>
            </div>
        </div>
    </div>
</div>
