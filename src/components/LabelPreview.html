<!-- Columna Vista Previa Real M3 -->
<div class="lg:col-span-7 flex flex-col items-center">
    <div class="w-full m3-card bg-slate-100/70 p-6 sm:p-10 rounded-3xl flex flex-col items-center justify-center min-h-[380px] relative border border-slate-200/90">
        <span class="absolute top-3.5 left-4 text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center space-x-1.5">
            <i class="fa-solid fa-eye text-indigo-600"></i>
            <span>Vista Previa Real</span>
            <span id="preview-dim-badge" class="ml-2 bg-white text-slate-700 border border-slate-200 px-2 py-0.5 rounded-full text-[10px] font-bold shadow-2xs">50x30 mm</span>
        </span>

        <!-- Contenedor dinámico de la Etiqueta Térmica -->
        <div id="label-container" class="thermal-paper label-preview-shadow rounded-sm p-2 flex flex-col items-center justify-between text-center transition-all duration-200 overflow-hidden box-border"></div>

        <p class="mt-4 text-xs text-slate-500 text-center">
            La vista previa refleja la proporción exacta configurada para el papel.
        </p>
    </div>

    <!-- Botones de Impresión y Descarga M3 -->
    <div class="w-full mt-6 space-y-3">
        <!-- Botón destacado de impresión directa por Bluetooth -->
        <button id="btn-print-direct-bt" onclick="printSingleDirectBT()" class="flex w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3.5 px-5 rounded-2xl shadow-md transition items-center justify-center space-x-2 text-sm sm:text-base border border-emerald-500/80 active:scale-[0.98]">
            <i class="fa-brands fa-bluetooth-b text-lg"></i>
            <span>Imprimir Directo por Bluetooth (Sin ventanas)</span>
        </button>

        <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button onclick="triggerPrintSystem()" class="m3-btn-filled py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center space-x-2 text-xs sm:text-sm active:scale-[0.98]">
                <i class="fa-solid fa-print"></i>
                <span>Impresión del Sistema (Windows)</span>
            </button>
            <button onclick="downloadLabelImage()" class="m3-btn-outlined py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center space-x-2 text-xs sm:text-sm active:scale-[0.98]">
                <i class="fa-solid fa-download text-slate-500"></i>
                <span>Guardar PNG</span>
            </button>
        </div>

        <!-- Botón rápido para alinear/avanzar rollo -->
        <div class="pt-1 flex items-center justify-between text-xs text-slate-500 px-1">
            <span class="text-[11px] text-slate-400">¿Nuevo rollo o desalineado?</span>
            <button type="button" onclick="feedOneLabelBluetooth()" class="inline-flex items-center space-x-1.5 text-indigo-600 hover:text-indigo-700 font-semibold text-xs py-1 px-2.5 rounded-full hover:bg-indigo-50 transition active:scale-95">
                <i class="fa-solid fa-forward-step"></i>
                <span>Avanzar 1 Etiqueta (Test de Paso)</span>
            </button>
        </div>
    </div>
</div>
