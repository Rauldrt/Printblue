<!-- ========================================================
     SECCIÓN 3: DISEÑADOR PERSONALIZADO & LOGO (Tab Designer)
     ======================================================== -->
<div id="tab-designer" class="tab-content hidden grid grid-cols-1 lg:grid-cols-12 gap-8 pb-24 lg:pb-0">
    
    <!-- Columna Izquierda: Controles del Diseñador M3 -->
    <div class="lg:col-span-5 m3-card p-6 space-y-5 rounded-3xl">
        <div class="border-b border-slate-100 pb-3 flex items-center justify-between">
            <div>
                <h2 class="text-base font-bold text-slate-900 flex items-center space-x-2">
                    <i class="fa-solid fa-palette text-indigo-600"></i>
                    <span>Diseñador & Logo</span>
                </h2>
                <p class="text-xs text-slate-500">Personaliza la etiqueta con tu marca, logo y formato libre</p>
            </div>
            <button type="button" onclick="saveDesignerConfig(true)" class="m3-btn-tonal text-xs font-semibold py-1.5 px-3 rounded-full flex items-center space-x-1.5 active:scale-95" title="Guardar plantilla personalizada">
                <i class="fa-solid fa-floppy-disk text-indigo-600"></i>
                <span class="hidden sm:inline">Guardar</span>
            </button>
        </div>

        <div class="space-y-4">
            
            <!-- SECCIÓN 1: LOGO E IDENTIDAD VISUAL -->
            <div class="p-3.5 bg-slate-50/90 rounded-2xl border border-slate-200/90 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="chk-designer-show-logo" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span class="text-xs font-bold text-slate-800 flex items-center space-x-1.5">
                            <i class="fa-solid fa-image text-indigo-600"></i>
                            <span>Logo de la Empresa</span>
                        </span>
                    </label>
                    <span class="text-[10px] text-slate-400 font-medium">PNG, JPG o SVG</span>
                </div>

                <!-- Estado sin logo cargado -->
                <div id="designer-logo-empty-prompt" class="pt-1">
                    <input type="file" id="inp-designer-logo-file" accept="image/*" class="hidden" onchange="if(this.files[0]) handleLogoUpload(this.files[0])">
                    <button type="button" onclick="document.getElementById('inp-designer-logo-file').click()" class="w-full py-3 px-4 border-2 border-dashed border-indigo-200 hover:border-indigo-400 bg-white hover:bg-indigo-50/40 rounded-xl text-center space-y-1 transition active:scale-[0.99] group">
                        <i class="fa-solid fa-cloud-arrow-up text-indigo-500 text-lg group-hover:scale-110 transition-transform"></i>
                        <span class="block text-xs font-bold text-slate-700">Subir Logo o Imagen</span>
                        <span class="block text-[10px] text-slate-400">Recomendado: fondo transparente o blanco</span>
                    </button>
                </div>

                <!-- Estado con logo cargado -->
                <div id="designer-logo-loaded-prompt" class="hidden flex items-center justify-between p-2 bg-white rounded-xl border border-slate-200 shadow-2xs">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
                        </div>
                        <span class="text-xs font-semibold text-slate-700">Logo cargado</span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <button type="button" onclick="document.getElementById('inp-designer-logo-file').click()" class="text-indigo-600 hover:text-indigo-800 text-xs font-semibold px-2 py-1 hover:underline">
                            Cambiar
                        </button>
                        <button type="button" onclick="removeLogo()" class="text-rose-500 hover:text-rose-700 text-xs font-semibold px-2 py-1 hover:underline">
                            Quitar
                        </button>
                    </div>
                </div>

                <!-- Ajustes avanzados de Logo Térmico (Contraste / Dithering) -->
                <div id="designer-logo-settings" class="hidden space-y-2.5 pt-2 border-t border-slate-200/80 text-xs">
                    <!-- Slider Umbral / Contraste Térmico -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[11px] font-semibold text-slate-700">Sensibilidad / Contraste Térmico:</label>
                            <span id="designer-threshold-val" class="text-xs font-bold text-indigo-600 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">135</span>
                        </div>
                        <input type="range" id="setting-designer-threshold" min="30" max="230" step="5" value="135" class="w-full accent-indigo-600 cursor-pointer">
                    </div>

                    <!-- Slider Tamaño del Logo -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[11px] font-semibold text-slate-700">Ancho del Logo (% del papel):</label>
                            <span id="designer-logo-size-val" class="text-xs font-bold text-indigo-600 bg-white border border-slate-200 px-2 py-0.5 rounded shadow-2xs">50%</span>
                        </div>
                        <input type="range" id="setting-designer-logo-size" min="20" max="95" step="5" value="50" class="w-full accent-indigo-600 cursor-pointer">
                    </div>

                    <!-- Invertir Colores y Alineación -->
                    <div class="flex items-center justify-between pt-1">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="chk-designer-invert-logo" class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span class="text-[11px] font-medium text-slate-700">Invertir colores (Fondo oscuro)</span>
                        </label>
                        <div class="flex items-center space-x-1">
                            <button type="button" onclick="setDesignerLogoAlign('left')" class="p-1 px-2 rounded border text-[11px] hover:bg-slate-100" title="Alinear a la izquierda">
                                <i class="fa-solid fa-align-left text-slate-600"></i>
                            </button>
                            <button type="button" onclick="setDesignerLogoAlign('center')" class="p-1 px-2 rounded border text-[11px] bg-indigo-50 text-indigo-700 border-indigo-200 font-bold" title="Centrado">
                                <i class="fa-solid fa-align-center"></i>
                            </button>
                            <button type="button" onclick="setDesignerLogoAlign('right')" class="p-1 px-2 rounded border text-[11px] hover:bg-slate-100" title="Alinear a la derecha">
                                <i class="fa-solid fa-align-right text-slate-600"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: TEXTOS Y MARCA -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Encabezado / Nombre de Marca</label>
                    <input type="text" id="inp-designer-header" value="MI COMERCIO" class="m3-input w-full text-sm p-2.5 font-bold tracking-tight uppercase" placeholder="Ej: MODA URBANA">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Subtítulo / Razón Social / Redes</label>
                    <input type="text" id="inp-designer-subheader" value="Ropa & Accesorios • Calidad Premium" class="m3-input w-full text-xs p-2.5 font-medium" placeholder="Ej: @mitienda • CUIT 30-12345678-9">
                </div>

                <label class="flex items-center space-x-2 cursor-pointer pt-0.5">
                    <input type="checkbox" id="chk-designer-show-divider" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                    <span class="text-xs font-medium text-slate-700">Mostrar línea divisoria decorativa</span>
                </label>
            </div>

            <!-- SECCIÓN 3: CÓDIGO DE BARRAS O QR -->
            <div class="p-3.5 bg-slate-50/90 rounded-2xl border border-slate-200/90 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="chk-designer-show-code" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span class="text-xs font-bold text-slate-800 flex items-center space-x-1.5">
                            <i class="fa-solid fa-qrcode text-indigo-600"></i>
                            <span>Incluir Código de Barras o QR</span>
                        </span>
                    </label>
                    <select id="inp-designer-code-type" class="m3-input text-xs p-1 px-2 bg-white font-medium">
                        <option value="QR">Código QR</option>
                        <option value="CODE128">Code 128 (Barras)</option>
                        <option value="EAN13">EAN-13 (13 dígitos)</option>
                    </select>
                </div>

                <div id="designer-code-fields" class="space-y-2.5 pt-1">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Contenido / Enlace / SKU:</label>
                        <input type="text" id="inp-designer-code-value" value="https://instagram.com/mitienda" class="m3-input w-full text-xs font-mono p-2 bg-white" placeholder="Ej: https://instagram.com/mitienda o 779123456789">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Leyenda debajo del código (Opcional):</label>
                        <input type="text" id="inp-designer-code-sub" value="Escaneá para ver catálogo" class="m3-input w-full text-xs p-2 bg-white" placeholder="Ej: Seguinos en Instagram">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 4: PIE / POLÍTICAS / PRECIO -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Leyenda / Políticas de Cambio / Garantía</label>
                    <input type="text" id="inp-designer-footer" value="Cambios con ticket dentro de los 30 días" class="m3-input w-full text-xs p-2.5 font-medium" placeholder="Ej: No se aceptan devoluciones sin ticket">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Precio Destacado (Opcional)</label>
                        <input type="text" id="inp-designer-price" value="" class="m3-input w-full text-sm p-2.5 font-bold" placeholder="Ej: 4500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Símbolo Moneda</label>
                        <input type="text" id="inp-designer-currency" value="$" class="m3-input w-full text-sm p-2.5 font-medium" placeholder="Ej: $ o U$S">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Columna Derecha: Vista Previa Térmica Real M3 e Impresión -->
    <div class="lg:col-span-7 flex flex-col items-center">
        <div class="w-full m3-card bg-slate-100/70 p-6 sm:p-10 rounded-3xl flex flex-col items-center justify-center min-h-[380px] relative border border-slate-200/90">
            <span class="absolute top-3.5 left-4 text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center space-x-1.5">
                <i class="fa-solid fa-eye text-indigo-600"></i>
                <span>Vista Previa del Diseño</span>
                <span id="designer-preview-dim-badge" class="ml-2 bg-white text-slate-700 border border-slate-200 px-2 py-0.5 rounded-full text-[10px] font-bold shadow-2xs">55x44 mm</span>
            </span>

            <!-- Canvas de la Etiqueta Térmica en Tiempo Real -->
            <div class="thermal-paper label-preview-shadow rounded-sm p-2 flex flex-col items-center justify-center text-center transition-all duration-200 overflow-hidden box-border">
                <canvas id="designer-preview-canvas" class="max-w-full max-h-[420px] object-contain"></canvas>
            </div>

            <p class="mt-4 text-xs text-slate-500 text-center">
                Muestra la renderización monocromática exacta que saldrá en tu impresora térmica.
            </p>
        </div>

        <!-- Botones de Impresión y Descarga M3 -->
        <div class="w-full mt-6 space-y-3">
            
            <!-- Selector de Cantidad de Copias -->
            <div class="p-3 bg-white rounded-2xl border border-slate-200 shadow-2xs flex items-center justify-between">
                <div>
                    <label class="text-xs font-bold text-slate-800 block">Copias a imprimir:</label>
                    <span class="text-[10px] text-slate-500">Cantidad de etiquetas de este diseño</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button type="button" onclick="adjustDesignerQty(-1)" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 text-sm active:scale-90 flex items-center justify-center transition">-</button>
                    <input type="number" id="inp-designer-quantity" value="1" min="1" max="100" class="w-16 text-center text-sm m3-input p-1.5 font-bold">
                    <button type="button" onclick="adjustDesignerQty(1)" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 text-sm active:scale-90 flex items-center justify-center transition">+</button>
                </div>
            </div>

            <!-- Botón destacado de impresión directa por Bluetooth -->
            <button id="btn-designer-print-bt" onclick="printDesignerDirectBT()" class="flex w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3.5 px-5 rounded-2xl shadow-md transition items-center justify-center space-x-2 text-sm sm:text-base border border-emerald-500/80 active:scale-[0.98]">
                <i class="fa-brands fa-bluetooth-b text-lg"></i>
                <span>Imprimir Diseño por Bluetooth (Sin ventanas)</span>
            </button>

            <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button type="button" onclick="triggerDesignerPrintSystem()" class="m3-btn-filled py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center space-x-2 text-xs sm:text-sm active:scale-[0.98]">
                    <i class="fa-solid fa-print"></i>
                    <span>Impresión del Sistema (Windows)</span>
                </button>
                <button type="button" onclick="downloadDesignerLabelImage()" class="m3-btn-outlined py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center space-x-2 text-xs sm:text-sm active:scale-[0.98]">
                    <i class="fa-solid fa-download text-slate-500"></i>
                    <span>Guardar PNG</span>
                </button>
            </div>

            <!-- Botón rápido para alinear/avanzar rollo -->
            <div class="pt-1 flex items-center justify-between text-xs text-slate-500 px-1">
                <span class="text-[11px] text-slate-400">¿Nuevo rollo o desalineado?</span>
                <button type="button" onclick="feedOneLabelBluetooth()" class="inline-flex items-center space-x-1.5 text-indigo-600 hover:text-indigo-700 font-semibold text-xs py-1 px-2.5 rounded-full hover:bg-indigo-50 transition active:scale-95">
                    <i class="fa-solid fa-forward-step"></i>
                    <span>Avanzar 1 Etiqueta (Test de Paso)</span>
                </button>
            </div>
        </div>
    </div>
</div>
