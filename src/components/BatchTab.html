<div id="tab-batch" class="tab-content hidden space-y-6">
    <div class="m3-card p-6 rounded-3xl space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4">
            <div>
                <h2 class="text-base font-bold text-slate-900">Lista de Productos para Impresión Múltiple</h2>
                <p class="text-xs text-slate-500">Carga artículos manualmente o impórtalos directamente desde tu Google Drive.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <!-- Botón Integración Google Drive M3 -->
                <button onclick="openDriveModal()" class="m3-btn-tonal text-emerald-800 bg-emerald-50 hover:bg-emerald-100 border-emerald-200 px-3.5 py-2 rounded-full text-xs flex items-center space-x-1.5 shadow-2xs active:scale-95">
                    <i class="fa-brands fa-google-drive text-emerald-600"></i>
                    <span>Importar de Google Sheets</span>
                </button>
                <button onclick="addBatchRow()" class="m3-btn-filled px-3.5 py-2 rounded-full text-xs flex items-center space-x-1 shadow-2xs active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span>Agregar Fila</span>
                </button>
                <button onclick="clearBatch()" class="m3-btn-outlined px-3.5 py-2 rounded-full text-xs active:scale-95">
                    Limpiar
                </button>
            </div>
        </div>

        <!-- Buscador Inteligente M3 con Filtros Rápidos -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </div>
                <input 
                    type="text" 
                    id="batch-search-input" 
                    placeholder="Buscar producto, SKU, precio o lote (ej: 'remera 4500', 'pantalon jean')..." 
                    class="m3-input w-full pl-9 pr-9 py-2.5 rounded-full text-xs font-medium"
                    oninput="setBatchSearchQuery(this.value)"
                >
                <button 
                    id="batch-search-clear" 
                    type="button" 
                    onclick="clearBatchSearch()" 
                    class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition"
                    title="Limpiar búsqueda"
                >
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div class="flex items-center space-x-2 shrink-0">
                <!-- Chips de Filtrado Rápido M3 -->
                <button 
                    type="button" 
                    id="chip-filter-all" 
                    onclick="setBatchFilterOnlySelected(false)" 
                    class="m3-chip active"
                >
                    <span>Todos</span>
                    <span id="chip-count-all" class="opacity-80 font-normal">2</span>
                </button>
                <button 
                    type="button" 
                    id="chip-filter-selected" 
                    onclick="setBatchFilterOnlySelected(true)" 
                    class="m3-chip"
                >
                    <span>Seleccionados</span>
                    <span id="chip-count-selected" class="opacity-80 font-normal">0</span>
                </button>

                <!-- Badge Contador de Resultados M3 -->
                <span id="batch-search-count-badge" class="hidden sm:inline-flex text-[11px] font-semibold text-slate-500 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full">
                    Total: 2
                </span>
            </div>
        </div>

        <!-- Barra de Acciones Masivas M3 -->
        <div id="batch-selection-toolbar" class="hidden p-3 bg-indigo-50 border border-indigo-200 rounded-2xl items-center justify-between flex-wrap gap-2 transition-all shadow-2xs">
            <div class="flex items-center space-x-2">
                <span id="batch-selected-count-badge" class="bg-indigo-600 text-white font-bold text-xs px-2.5 py-1 rounded-full shadow-2xs"></span>
                <span class="text-xs text-slate-600 hidden sm:inline font-medium">seleccionados:</span>
            </div>
            <div class="flex items-center flex-wrap gap-2">
                <button onclick="deleteSelectedItems()" class="bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center space-x-1 shadow-2xs transition active:scale-95">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Eliminar</span>
                </button>
                <button onclick="printBatchBT(true)" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-xs font-semibold px-3.5 py-1.5 rounded-full flex items-center space-x-1 shadow-2xs transition active:scale-95">
                    <i class="fa-brands fa-bluetooth-b"></i>
                    <span>Imprimir BT</span>
                </button>
                <button onclick="printBatch(true)" class="m3-btn-filled text-xs px-3.5 py-1.5 rounded-full flex items-center space-x-1 shadow-2xs active:scale-95">
                    <i class="fa-solid fa-print"></i>
                    <span>Imprimir (Windows)</span>
                </button>
                <button onclick="toggleSelectAll(false)" class="text-slate-500 hover:text-slate-700 text-xs font-medium px-2 py-1 rounded-lg hover:bg-white/60 transition">
                    Deseleccionar
                </button>
            </div>
        </div>

        <!-- Tabla de Productos M3 -->
        <div class="overflow-x-auto rounded-2xl border border-slate-200">
            <table class="w-full text-left text-xs text-slate-600">
                <thead class="bg-slate-50/80 text-slate-700 font-bold uppercase border-b border-slate-200 text-[11px]">
                    <tr>
                        <th class="p-3 text-center w-10">
                            <input type="checkbox" id="batch-select-all" onchange="toggleSelectAll(this.checked)" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" title="Seleccionar todos">
                        </th>
                        <th class="p-3">Nombre Producto</th>
                        <th class="p-3">Código / SKU</th>
                        <th class="p-3 w-24">Precio</th>
                        <th class="p-3">Texto Extra / Lote</th>
                        <th class="p-3 w-16 sm:w-20">Cantidad</th>
                        <th class="p-3 text-center w-10">Acción</th>
                    </tr>
                </thead>
                <tbody id="batch-table-body" class="divide-y divide-slate-100 bg-white"></tbody>
            </table>
        </div>

        <div class="mt-6 flex flex-wrap items-center justify-end gap-3 pt-2 border-t border-slate-100">
            <!-- Botón directo BT para lote M3 -->
            <button id="btn-print-batch-bt" onclick="printBatchBT(false)" class="flex bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3.5 px-6 rounded-2xl shadow-md transition items-center space-x-2 text-sm border border-emerald-500/80 active:scale-[0.98]">
                <i class="fa-brands fa-bluetooth-b text-lg"></i>
                <span>Imprimir Todo por Bluetooth</span>
            </button>
            <button id="btn-print-selected" onclick="printBatch(true)" class="hidden m3-btn-tonal font-bold py-3.5 px-5 rounded-2xl shadow-2xs items-center space-x-2 text-sm active:scale-[0.98]">
                <i class="fa-solid fa-print"></i>
                <span>Imprimir Seleccionados</span>
            </button>
            <button onclick="printBatch(false)" class="m3-btn-filled font-bold py-3.5 px-6 rounded-2xl shadow-md flex items-center space-x-2 text-sm active:scale-[0.98]">
                <i class="fa-solid fa-print"></i>
                <span>Impresión del Sistema (Windows)</span>
            </button>
        </div>
    </div>
</div>
